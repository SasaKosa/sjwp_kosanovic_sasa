<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #crveni {
        position: relative;
        background-color: red;
        width: 500px;
        height: 350px;
        top: 300px;
        left: 725px;
      }
      #bijeli {
        background-color: white;
        position: absolute;
        top: 90px;
        left: 80px;
        width: 170px;
        height: 170px;
        border-radius: 50%;
      }
      #zvijezda {
        position: absolute;
        width: 100px;
        height: 100px;
        background-color: white;
        clip-path: polygon(
          50% 0%,
          61% 35%,
          98% 35%,
          68% 57%,
          79% 91%,
          50% 70%,
          21% 91%,
          32% 57%,
          2% 35%,
          39% 35%
        );
        transform: rotate(-20deg);
        top: 125px;
        left: 225px;
      }
      #crvenik {
        background-color: red;
        position: absolute;
        top: 104px;
        left: 112px;
        width: 143px;
        height: 143px;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <div id="crveni">
      <div id="bijeli"></div>
      <div id="crvenik"></div>
      <div id="zvijezda"></div>
    </div>
  </body>
</html>
